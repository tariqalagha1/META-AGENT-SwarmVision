worker_processes auto;

events {
    worker_connections 4096;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    gzip          on;
    gzip_types    text/plain application/json application/javascript text/css;

    # ── Upstream blocks ───────────────────────────────────────────────────────

    upstream replay_service {
        server replay-service:3002;
        keepalive 32;
    }

    upstream auth_gateway {
        server auth-gateway:4000;
        keepalive 16;
    }

    upstream signaling {
        server signaling:80;
    }

    upstream intelligence_service {
        server intelligence-service:3004;
        keepalive 16;
    }

    upstream grafana {
        server grafana:3000;
    }

    # ── Rate limiting ─────────────────────────────────────────────────────────

    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=ingest:10m rate=600r/m;

    # ── HTTPS server ──────────────────────────────────────────────────────────

    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:20m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss: https:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none';" always;

        # ── Pixel Streaming viewer (static player) ────────────────────────────
        location / {
            proxy_pass          http://signaling;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade $http_upgrade;
            proxy_set_header    Connection "upgrade";
            proxy_set_header    Host $host;
            proxy_read_timeout  3600s;
        }

        # ── WebSocket upgrade for Pixel Streaming signaling ───────────────────
        location /ws {
            proxy_pass          http://signaling;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade $http_upgrade;
            proxy_set_header    Connection "upgrade";
            proxy_read_timeout  3600s;
        }

        # ── Replay service REST ───────────────────────────────────────────────
        location /api/replay {
            limit_req zone=api burst=20 nodelay;
            rewrite   ^/api/replay/(.*) /$1 break;
            proxy_pass http://replay_service;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Type  $content_type;
        }

        # ── Replay WebSocket ──────────────────────────────────────────────────
        location /api/replay/ws {
            proxy_pass         http://replay_service;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        # ── Ingest (internal relay → replay-service) ──────────────────────────
        location /api/ingest {
            limit_req zone=ingest burst=100 nodelay;
            rewrite   ^/api/ingest/(.*) /ingest/$1 break;
            proxy_pass http://replay_service;
            proxy_set_header X-Internal-Key $http_x_internal_key;
        }

        # ── Intelligence service ──────────────────────────────────────────────
        location /api/intelligence/ {
            limit_req zone=api burst=30 nodelay;
            rewrite   ^/api/intelligence/(.*) /$1 break;
            proxy_pass http://intelligence_service;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/intelligence/stream {
            proxy_pass         http://intelligence_service/stream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        # ── Auth gateway ──────────────────────────────────────────────────────
        location /api/auth {
            limit_req zone=api burst=10 nodelay;
            rewrite   ^/api/auth/(.*) /$1 break;
            proxy_pass http://auth_gateway;
        }

        # ── Grafana observability dashboard ───────────────────────────────────
        location /grafana/ {
            proxy_pass http://grafana/;
            proxy_set_header Host $host;
        }
    }

    # ── HTTP redirect to HTTPS ────────────────────────────────────────────────
    server {
        listen 8080;
        return 301 https://$host$request_uri;
    }
}
