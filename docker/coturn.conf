# coturn TURN/STUN configuration for SwarmVision Pixel Streaming
# Replace REPLACE_WITH_PUBLIC_IP and credentials before deploying.

listening-port=3478
tls-listening-port=5349

# Use your server's public IP
external-ip=REPLACE_WITH_PUBLIC_IP

# Relay IP range
relay-ip=REPLACE_WITH_PRIVATE_IP

# SRTP relay port range (must match docker-compose port mapping)
min-port=49152
max-port=49200

# Shared secret for TURN credentials (time-limited auth)
use-auth-secret
static-auth-secret=REPLACE_WITH_TURN_SECRET

realm=swarmvision.internal
server-name=swarmvision-turn

# TLS certificate (mount via volume or provide paths)
# cert=/etc/coturn/ssl/turn.crt
# pkey=/etc/coturn/ssl/turn.key

# Logging
log-file=/var/log/coturn/turnserver.log
verbose

# Disable unused protocols
no-multicast-peers
no-loopback-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
